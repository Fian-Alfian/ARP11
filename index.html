<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Elang dan Bangkai (Atribut Animasi)</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <script>
      // Komponen soundhandler Anda
      AFRAME.registerComponent("soundhandler", {
        init: function () {
          this.soundEl = document.querySelector("[sound]");
          this.marker = document.querySelector("a-marker");
          this.visible = false;
        },
        tick: function () {
          if (this.marker.object3D.visible && !this.visible) {
            if (this.soundEl && this.soundEl.components.sound) {
              this.soundEl.components.sound.stopSound();
              this.soundEl.components.sound.playSound();
            }
            this.visible = true;
          } else if (!this.marker.object3D.visible) {
            this.visible = false;
            if (this.soundEl && this.soundEl.components.sound) {
                this.soundEl.components.sound.stopSound();
            }
          }
        },
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <a-scene embedded arjs="sourceType: webcam; detectionMode: mono; maxDetectionRate: 5; cameraParametersUrl: https://raw.githack.com/AR-js-org/AR.js/master/data/data/camera_para.dat; debugUIEnabled: false;">

      <a-assets>
        <a-asset-item id="carcass-gltf" src="assets/3D/objek2/scene.gltf"></a-asset-item>
        <a-asset-item id="eagle-gltf" src="assets/3D/eagle/scene.gltf"></a-asset-item>
        <audio id="eagle-sound" src="./assets/audio/eagle-281163.mp3" preload="auto"></audio>
      </a-assets>

      <a-marker preset="hiro" soundhandler>
        <a-entity
          id="carcass"
          gltf-model="#carcass-gltf"
          scale="0.5 0.5 0.5"
          position="0 0.2 0"
          look-at="a-camera"
        ></a-entity>

        <a-entity
          id="eagle-orbit"
          position="0 0.5 0"
          animation="property: rotation; dur: 15000; easing: linear; to: 0 360 0; loop: true;"
        >
          <a-entity
            id="eagle"
            gltf-model="#eagle-gltf"
            scale="0.2 0.2 0.2"
            position="1.5 0.5 0"
            rotation="0 90 0"
            look-at="#carcass"
            animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true; from: 0 0 0;"
          >
            <a-animation-mixer clip="*" loop="repeat"></a-animation-mixer>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity sound="src: #eagle-sound; autoplay: false; volume: 0.5;"></a-entity>

      <a-camera></a-camera>
    </a-scene>
  </body>
</html>
